name: Build Windows Portable Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/build-native-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: native-portable-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable native app
        run: npm run tauri:exe

      - name: Collect ONNX Runtime DLLs and package ZIP
        shell: pwsh
        run: |
          $stage = "native-test/ParanRecorder"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "src-tauri/target/release/paran-recorder.exe" "$stage/ParanRecorder.exe" -Force

          $dlls = Get-ChildItem -Path "src-tauri/target/release" -Recurse -Filter "*.dll" |
            Where-Object { $_.Name -match "onnx|DirectML|dml" } |
            Sort-Object Name -Unique

          foreach ($dll in $dlls) {
            Write-Host "Bundling native DLL: $($dll.FullName)"
            Copy-Item $dll.FullName "$stage/$($dll.Name)" -Force
          }

          @"
          Paran Recorder Portable Test

          Run ParanRecorder.exe.

          Background-removal engines:
          - MediaPipe
          - RVM Native HQ 640x480, fgr+pha

          The RVM model is not bundled. On first use of RVM Native HQ,
          the app downloads the official RVM ONNX model to local app data.

          Microsoft Edge WebView2 Runtime is required.
          Build commit: $env:GITHUB_SHA
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8

          New-Item -ItemType Directory -Force -Path "native-test" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "native-test/Paran-Recorder-Portable-Test.zip" -Force

          Write-Host "Portable package contents:"
          Get-ChildItem $stage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paran-Recorder-Portable-Test
          path: native-test/Paran-Recorder-Portable-Test.zip
          if-no-files-found: error

      - name: Publish fixed dev-latest release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "native-test/Paran-Recorder-Portable-Test.zip"
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA

          & gh release view dev-latest --repo $repo *> $null
          $exists = $LASTEXITCODE -eq 0

          if (-not $exists) {
            gh release create dev-latest $asset --repo $repo --target $sha --title "Paran Recorder Dev Latest" --notes "Latest Windows portable test build. Commit: $sha" --prerelease
          } else {
            gh release upload dev-latest $asset --repo $repo --clobber
            gh release edit dev-latest --repo $repo --title "Paran Recorder Dev Latest" --notes "Latest Windows portable test build. Commit: $sha" --prerelease
          }
