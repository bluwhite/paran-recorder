name: Build Windows Native Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/native-onnx-engine.js"
      - "src/segmentation.js"
      - "src/index.html"
      - "scripts/prepare-native-model.mjs"
      - "package.json"
      - ".github/workflows/native-windows.yml"

permissions:
  contents: read

jobs:
  convert-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare PaddleSeg export environment
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch release/2.10 https://github.com/PaddlePaddle/PaddleSeg.git paddle-seg
          python -m pip install --upgrade pip
          python -m pip install "paddlepaddle==2.6.2" "paddle2onnx==1.3.1" packaging
          python -m pip install -r paddle-seg/requirements.txt

      - name: Download PP-HumanSegV2-Lite checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p checkpoint
          curl -L --fail \
            "https://paddleseg.bj.bcebos.com/dygraph/pp_humanseg_v2/portrait_pp_humansegv2_lite_256x144_smaller/portrait_pp_humansegv2_lite_256x144_pretrained.zip" \
            -o checkpoint/model.zip
          unzip -q checkpoint/model.zip -d checkpoint/unpacked
          find checkpoint/unpacked -maxdepth 4 -type f -print

          model_path="$(find checkpoint/unpacked -type f -name '*.pdparams' | head -n 1)"
          test -n "$model_path"
          echo "PPHUMANSEG_MODEL_PATH=$GITHUB_WORKSPACE/$model_path" >> "$GITHUB_ENV"

      - name: Export fixed-shape Paddle inference model
        shell: bash
        run: |
          set -euxo pipefail
          cd paddle-seg
          python tools/export.py \
            --config contrib/PP-HumanSeg/configs/portrait_pp_humansegv2_lite.yml \
            --model_path "$PPHUMANSEG_MODEL_PATH" \
            --save_dir "$GITHUB_WORKSPACE/static-model" \
            --input_shape 1 3 144 256 \
            --output_op softmax
          find "$GITHUB_WORKSPACE/static-model" -maxdepth 2 -type f -print

      - name: Convert fixed-shape model to ONNX
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p converted-model
          paddle2onnx \
            --model_dir static-model \
            --model_filename model.pdmodel \
            --params_filename model.pdiparams \
            --save_file converted-model/pp_humanseg_v2_lite.onnx \
            --opset_version 11 \
            --enable_onnx_checker True
          test $(stat -c%s converted-model/pp_humanseg_v2_lite.onnx) -gt 1000000
          ls -lh converted-model/pp_humanseg_v2_lite.onnx

      - name: Upload converted ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: PP-HumanSegV2-Lite-ONNX
          path: converted-model/pp_humanseg_v2_lite.onnx
          if-no-files-found: error

  build:
    needs: convert-model
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download converted PP-HumanSegV2 ONNX
        uses: actions/download-artifact@v4
        with:
          name: PP-HumanSegV2-Lite-ONNX
          path: src-tauri/resources/models

      - name: Verify native model
        run: npm run native:model

      - name: Warm native build and collect ONNX Runtime DLLs
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release

          $dlls = Get-ChildItem -Path "src-tauri/target/release" -Recurse -Filter "*.dll" |
            Where-Object { $_.Name -match "onnx|DirectML|dml" } |
            Sort-Object Name -Unique

          foreach ($dll in $dlls) {
            Write-Host "Bundling native DLL: $($dll.FullName)"
            Copy-Item $dll.FullName "src-tauri/resources/$($dll.Name)" -Force
          }

          Write-Host "Native resource directory:"
          Get-ChildItem "src-tauri/resources" -Recurse

      - name: Build NSIS native host
        run: npm run tauri:build -- --bundles nsis

      - name: Create install-free native test ZIP
        shell: pwsh
        run: |
          $stage = "native-test/ParanRecorder"
          New-Item -ItemType Directory -Force -Path "$stage/models" | Out-Null

          Copy-Item "src-tauri/target/release/paran-recorder.exe" "$stage/ParanRecorder.exe" -Force
          Copy-Item "src-tauri/resources/models/pp_humanseg_v2_lite.onnx" "$stage/models/pp_humanseg_v2_lite.onnx" -Force

          Get-ChildItem "src-tauri/resources" -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "$stage/$($_.Name)" -Force
          }

          @"
          Paran Recorder Native Test - PP-HumanSegV2-Lite

          1. Keep all files in this folder together.
          2. Run ParanRecorder.exe.
          3. In AI background engine, choose ONNX Runtime Native · PP-HumanSegV2.
          4. Compare it with MediaPipe using the same camera and lighting.

          This test build requires Microsoft Edge WebView2 Runtime.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8

          Compress-Archive -Path "$stage/*" -DestinationPath "native-test/Paran-Recorder-Native-Test.zip" -Force
          Get-ChildItem "native-test" -Recurse

      - name: Upload install-free native test
        uses: actions/upload-artifact@v4
        with:
          name: Paran-Recorder-Native-Test
          path: native-test/Paran-Recorder-Native-Test.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Paran-Recorder-Native-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
