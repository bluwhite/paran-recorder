name: Build Windows Native Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/native-onnx-engine.js"
      - "src/segmentation.js"
      - "src/index.html"
      - "scripts/prepare-native-model.mjs"
      - "package.json"
      - ".github/workflows/native-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert PP-HumanSegV2-Lite to ONNX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "native-model-source" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/models" | Out-Null

          $base = "https://huggingface.co/unography/PP-HumanSegV2-Lite/resolve/9892dd73de78985969ba3f3a0c9e58b0b776cc07/portrait_pp_humansegv2_lite_256x144_inference_model_with_softmax"
          Invoke-WebRequest -Uri "$base/model.pdmodel?download=true" -OutFile "native-model-source/model.pdmodel"
          Invoke-WebRequest -Uri "$base/model.pdiparams?download=true" -OutFile "native-model-source/model.pdiparams"

          python -m pip install --upgrade pip
          python -m pip install paddle2onnx

          paddle2onnx `
            --model_dir native-model-source `
            --model_filename model.pdmodel `
            --params_filename model.pdiparams `
            --save_file src-tauri/resources/models/pp_humanseg_v2_lite.onnx `
            --opset_version 11 `
            --enable_onnx_checker True

          $size = (Get-Item "src-tauri/resources/models/pp_humanseg_v2_lite.onnx").Length
          Write-Host "PP-HumanSegV2-Lite ONNX bytes: $size"
          if ($size -lt 1000000) { throw "Converted PP-HumanSeg ONNX model looks incomplete." }

      - name: Verify native model
        run: npm run native:model

      - name: Warm native build and collect ONNX Runtime DLLs
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release

          $dlls = Get-ChildItem -Path "src-tauri/target/release" -Recurse -Filter "*.dll" |
            Where-Object { $_.Name -match "onnx|DirectML|dml" } |
            Sort-Object Name -Unique

          foreach ($dll in $dlls) {
            Write-Host "Bundling native DLL: $($dll.FullName)"
            Copy-Item $dll.FullName "src-tauri/resources/$($dll.Name)" -Force
          }

          Write-Host "Native resource directory:"
          Get-ChildItem "src-tauri/resources" -Recurse

      - name: Build NSIS native host
        run: npm run tauri:build -- --bundles nsis

      - name: Create install-free native test ZIP
        shell: pwsh
        run: |
          $stage = "native-test/ParanRecorder"
          New-Item -ItemType Directory -Force -Path "$stage/models" | Out-Null

          Copy-Item "src-tauri/target/release/paran-recorder.exe" "$stage/ParanRecorder.exe" -Force
          Copy-Item "src-tauri/resources/models/pp_humanseg_v2_lite.onnx" "$stage/models/pp_humanseg_v2_lite.onnx" -Force

          Get-ChildItem "src-tauri/resources" -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "$stage/$($_.Name)" -Force
          }

          @"
          Paran Recorder Native Test

          1. Keep all files in this folder together.
          2. Run ParanRecorder.exe.
          3. In AI background engine, choose ONNX Runtime Native · PP-HumanSegV2.
          4. If ONNX Native is unavailable, note the status text shown in the app.

          This test build requires Microsoft Edge WebView2 Runtime.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8

          Compress-Archive -Path "$stage/*" -DestinationPath "native-test/Paran-Recorder-Native-Test.zip" -Force
          Get-ChildItem "native-test" -Recurse

      - name: Upload converted ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: PP-HumanSegV2-Lite-ONNX
          path: src-tauri/resources/models/pp_humanseg_v2_lite.onnx
          if-no-files-found: error

      - name: Upload install-free native test
        uses: actions/upload-artifact@v4
        with:
          name: Paran-Recorder-Native-Test
          path: native-test/Paran-Recorder-Native-Test.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Paran-Recorder-Native-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
