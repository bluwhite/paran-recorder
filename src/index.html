<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src 'self'">
  <title>Paran Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">PARAN RECORDER</div>
      <h1>강의 녹화</h1>
    </div>
    <div id="statusBadge" class="status-badge">준비</div>
  </header>

  <main class="layout">
    <section class="preview-panel panel">
      <div class="panel-title-row">
        <div>
          <h2>녹화 화면</h2>
          <p>실제 저장되는 화면을 그대로 미리 봅니다.</p>
        </div>
        <div id="recordingTimer" class="timer">00:00:00</div>
      </div>

      <div class="canvas-wrap">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
        <div id="emptyPreview" class="empty-preview">
          <strong>미리보기를 시작하세요</strong>
          <span>화면, 카메라, 마이크를 선택한 뒤 아래 버튼을 누르세요.</span>
        </div>
      </div>

      <div class="primary-actions">
        <button id="previewButton" class="button secondary">▶ 미리보기 시작</button>
        <button id="recordButton" class="button record" disabled>● 녹화 시작</button>
        <button id="stopButton" class="button stop" disabled>■ 녹화 종료</button>
      </div>
      <div id="message" class="message" aria-live="polite"></div>
    </section>

    <aside class="settings-panel panel">
      <h2>입력 설정</h2>

      <label class="field">
        <span>녹화할 화면</span>
        <div class="inline-control">
          <select id="sourceSelect"></select>
          <button id="refreshSourcesButton" class="icon-button" title="화면 목록 새로고침">↻</button>
        </div>
      </label>

      <label class="field">
        <span>카메라</span>
        <select id="cameraSelect"></select>
      </label>

      <label class="field">
        <span>마이크</span>
        <select id="microphoneSelect"></select>
      </label>

      <button id="refreshDevicesButton" class="button subtle full">카메라·마이크 새로고침</button>

      <div class="separator"></div>

      <div class="switch-row">
        <div>
          <strong>얼굴 표시</strong>
          <small>강의 화면 위에 카메라를 배치합니다.</small>
        </div>
        <label class="switch">
          <input id="cameraEnabled" type="checkbox" checked>
          <span></span>
        </label>
      </div>

      <div class="switch-row muted-feature">
        <div>
          <strong>AI 배경 제거</strong>
          <small>다음 버전에서 추가 예정</small>
        </div>
        <label class="switch">
          <input type="checkbox" disabled>
          <span></span>
        </label>
      </div>

      <label class="field">
        <span>얼굴 위치</span>
        <select id="cameraPosition">
          <option value="bottom-right">오른쪽 아래</option>
          <option value="bottom-left">왼쪽 아래</option>
          <option value="top-right">오른쪽 위</option>
          <option value="top-left">왼쪽 위</option>
        </select>
      </label>

      <label class="field">
        <span>얼굴 크기 <b id="cameraSizeValue">24%</b></span>
        <input id="cameraSize" type="range" min="15" max="40" value="24">
      </label>

      <label class="check-row">
        <input id="mirrorCamera" type="checkbox" checked>
        <span>카메라 좌우 반전</span>
      </label>

      <div class="separator"></div>
      <div class="info-box">
        <strong>v0.1</strong>
        <span>화면 + 얼굴 + 마이크를 하나의 WebM 파일로 저장합니다.</span>
        <span id="systemAudioInfo"></span>
      </div>
    </aside>
  </main>

  <video id="screenVideo" autoplay muted playsinline hidden></video>
  <video id="cameraVideo" autoplay muted playsinline hidden></video>

  <script src="renderer.js"></script>
</body>
</html>
