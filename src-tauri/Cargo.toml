[package]
name = "paran-recorder"
version = "0.2.0"
description = "Paran Recorder"
authors = ["bluwhite"]
edition = "2021"

[lib]
name = "paran_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
